<style>
:root{--ink:#16201D;--muted:#4F5B57;--line:#DDE3E0;--soft:#EDF0EE;--ground:#F4F6F5;--card:#FFFFFF;--teal:#0D6B63;--teal-soft:#E3F1EF;--teal-bg:#F3FAF9;--indigo:#34418F;--indigo-soft:#E7EAF7;--purple:#6B3FA0;--purple-soft:#EFE8F7;--orange:#9A4209;--orange-soft:#FDEBDD;--red:#B42318;--red-soft:#FDE8E6;--dark:#16201D;--dark2:#2A3633}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;border:0;background:none;padding:0;text-align:left}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center}
.brand b{font-size:18px}
.brand small{font-size:13px;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav button{min-height:44px;padding:0 14px;border-radius:10px;border:0;background:none;font-size:15px;font-weight:500}
.nav button[aria-current="page"]{background:var(--teal-soft);color:var(--teal);font-weight:700}
.bottom{display:none}
main{padding:28px 0 64px}
.page{display:flex;flex-direction:column;gap:18px}
.title h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.title p{margin-top:6px;font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.pad{padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.grow{flex:999 1 600px;min-width:0}
.side{flex:1 1 300px;min-width:0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.pick label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#34418F}
.pick select,.fsel{min-height:44px;width:100%;border-radius:10px;border:1px solid #C9D2CE;padding:0 10px;font-size:15px;font-weight:600;background:#fff;color:var(--ink)}
.pick .fixed{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:#E7EAF7;font-size:15px;font-weight:700;color:#34418F}
.seg{display:inline-flex;gap:4px;background:#E6EBE9;border-radius:12px;padding:4px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--teal)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.pill{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid #C9D2CE;background:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"].dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex-shrink:0}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--teal);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.line{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.muted{color:var(--muted)}
.small{font-size:13px}
.strip{background:var(--dark);color:#fff;border-radius:16px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.strip .it{display:flex;align-items:center;gap:8px;background:var(--dark2);border-radius:10px;padding:6px 12px;font-size:14px}
.strip .hot{color:#FFD2B3;font-weight:600}
.cal{overflow-x:auto}
.cal-in{min-width:620px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--soft)}
.wk.head{background:#F7F9F8;border-bottom:1px solid var(--line)}
.wk.head div{padding:10px 0;text-align:center;font-size:13px;font-weight:700;color:var(--muted)}

.day[aria-pressed="true"]{background:var(--teal-bg);box-shadow:inset 0 0 0 2px var(--teal)}

.num.today{background:var(--teal);color:#fff!important}
.sun{color:#C0362C}.sat{color:#2F55A4}
.ev{display:block;max-width:100%;border-radius:6px;padding:2px 6px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:none;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;display:block}
.more{font-size:12px;font-weight:600;color:var(--muted);padding:0 4px}
.evcard{border:1px solid var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--soft)}
ul.plain,ol.plain{list-style:none;margin:0;padding:0}
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.6}
.bul li.sub{list-style:none;margin-left:4px;color:var(--muted)}
.bul li.sub::before{content:'· ';font-weight:700}
.slist{max-height:980px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.sbtn{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--soft);background:#fff;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sbtn[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal)}
.search{display:flex;align-items:center;gap:8px;border:1px solid #C9D2CE;border-radius:12px;padding:0 12px;min-height:46px;background:#fff}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fact{background:#F7F9F8;border-radius:12px;padding:12px 14px}
.fact b{display:block;margin-top:4px;font-size:18px}
.box-sp{border:2px solid var(--teal);background:var(--teal-bg);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.dl{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;margin:0;font-size:14px;line-height:1.55}
.dl dt{font-weight:700}.dl dd{margin:0}
.calc{background:#fff;border:1px solid #CFE3E0;border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.calc input{width:120px;min-height:40px;border:1px solid #C9D2CE;border-radius:10px;padding:0 10px;font-size:15px;color:var(--ink)}
.res{min-height:40px;display:flex;align-items:center;padding:0 14px;border-radius:10px;font-size:14px;font-weight:700}
.warnbox{background:var(--red-soft);border-radius:14px;padding:14px 16px}
.notebox{background:var(--orange-soft);border-radius:18px;padding:18px 20px}
.step{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--soft);align-items:center}
.step .tag{font-size:12px;font-weight:700;white-space:nowrap}
.method p{font-size:14px;line-height:1.6;padding-left:12px;border-left:3px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;background:#F7F9F8;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--soft);vertical-align:top}
.scroll{overflow-x:auto}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rule{padding:18px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:44px;border-radius:10px;overflow:hidden;font-size:13px;font-weight:700;color:#fff}
.bar div{display:flex;align-items:center;justify-content:center;border-left:2px solid #fff}
.bar div:first-child{border-left:0}
.opt{width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--soft);background:#fff;text-align:left;display:flex;align-items:center;gap:12px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-bg)}
.radio{width:18px;height:18px;flex-shrink:0;border-radius:9px;border:2px solid #B9C3BF;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed="true"] .radio{border-color:var(--teal)}
.opt[aria-pressed="true"] .radio::after{content:"";width:8px;height:8px;border-radius:4px;background:var(--teal)}
.choice{min-height:60px;padding:10px 14px;border-radius:12px;border:2px solid var(--soft);background:#fff;text-align:left;display:flex;flex-direction:column;gap:2px}
.choice[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-bg)}
.choice.back[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft)}
.badge{width:28px;height:28px;border-radius:14px;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.summary{background:var(--dark);color:#fff;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.summary .t{background:var(--dark2);border-radius:10px;padding:6px 12px;font-size:13px}
.summary select{min-height:44px;min-width:260px;border-radius:10px;border:0;padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);background:#fff}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;list-style:none;margin:0;padding:0}
.flow span.s{border-radius:8px;padding:5px 10px;font-weight:700;background:var(--dark2)}
.flow span.s.on{background:var(--teal)}
.ok-ico,.no-ico{width:22px;height:22px;flex-shrink:0;border-radius:11px;display:flex;align-items:center;justify-content:center}
.ok-ico{background:var(--teal-soft);color:var(--teal)}
.no-ico{background:var(--red-soft);color:var(--red)}
.path .p{display:flex;gap:14px;align-items:stretch}
.path .w{width:132px;flex-shrink:0;font-size:13px;font-weight:700;padding:10px 0}
.path .ln{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.path .ln i{width:12px;height:12px;border-radius:6px;margin-top:14px;display:block}
.path .ln b{width:2px;flex:1;background:var(--line)}
.path .c{padding:9px 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;font-weight:600}
.empty{padding:32px;text-align:center;color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.sescards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
:focus-visible{outline:3px solid #2F55A4;outline-offset:2px}
@media (max-width:720px){
  .wrap{padding:0 16px}
  .top .nav{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:6}
  .bottom button{min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted)}
  .bottom button[aria-current="page"]{color:var(--teal);font-weight:700}
  main{padding:20px 0 96px}
  .title h1{font-size:23px}
  .cal-in{min-width:0}
  .day{min-height:52px;padding:4px 0;align-items:center;border-right:0}
  .day .ev,.day .more{display:none}
  .dots{display:flex}
  .wk{border-bottom:0}
  .path .w{width:96px}
  .summary select{min-width:0;width:100%}
}
</style>

        h += '<div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid #EDF0EE;padding-top:12px"><div class="row" style="gap:10px;align-items:center;justify-content:space-between"><b>평준화 일반고 지망 순서 <span class="muted" style="font-weight:600">' + picks.length + '/' + SLOTS + '</span></b>' +
          (picks.length ? '<button type="button" class="btn line" data-act="wclear" style="min-height:36px;padding:0 12px;font-size:13px">지망 모두 지우기</button>' : '') + '</div>' +
          '<p class="small muted">' + (wOff === 2 ? '1지망은 ' + esc(fl.name) + '로 정해져 있어요. 2지망부터 ' + (SLOTS + 1) + '지망까지 평준화 일반고를 가고 싶은 순서대로 골라요.' : '1지망부터 ' + SLOTS + '지망까지 가고 싶은 순서대로 골라요.') + ' 한 학교는 한 번만 쓸 수 있어요.</p><div class="pick">' +
          (wOff === 2 ? '<label>1지망<span class="fixed">' + esc(fl.name + (ST.fd ? ' ' + ST.fd : '')) + '</span></label>' : '');
        for (wi = 0; wi < SLOTS; wi++) {
          var mine = ST['w' + wi];
          h += '<label for="w' + wi + '">' + (wi + wOff) + '지망<select id="w' + wi + '" data-change="w' + wi + '"><option value="">선택 안 함</option>' +
            eqAvail.filter(function (s) { return s.id === mine || !seenW[s.id]; }).map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === mine ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select></label>';
        }
        h += '</div>' + (picks.length === SLOTS ? '<p class="small" style="color:#0D6B63;font-weight:600">' + SLOTS + '개 지망을 모두 골랐어요.</p>' : '') + '</div>';
      }
      h += '<ul class="bul" style="background:#F7F9F8;border-radius:12px;padding:14px 16px 14px 34px">' + B.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></section>';
    } else {
      h += '<section style="background:#FDE8E6;border-radius:18px;padding:18px 20px;display:flex;gap:12px;align-items:flex-start"><span style="color:#B42318;flex-shrink:0">' + icon('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/>', 24) + '</span><div><p style="font-size:16px;font-weight:700;color:#B42318">후기 학교에는 지원할 수 없어요</p><p class="small" style="margin-top:4px;line-height:1.6">전기 학교에 합격하면 등록하지 않더라도 후기 학교, 추가모집, 수시모집에 지원할 수 없어요. 다른 학교에 원서를 내면 이중지원으로 합격이 취소돼요.</p></div></section>';
    }

    var TAG = { front: ['#EFE8F7', '#6B3FA0', '전기'], back: ['#E7EAF7', '#34418F', '후기'], ok: ['#E3F1EF', '#0D6B63', '할 일'], stop: ['#FDE8E6', '#B42318', '지원 불가'], opt: ['#FDEBDD', '#9A4209', '선택'], gen: ['#E3F1EF', '#0D6B63', '전기 일반전형'], skip: ['#EDF0EE', '#4F5B57', '지원 안 함'] };
    var path = [];
    var add = function (w, t, tone) { path.push([w, t, tone]); };
    curSteps.forEach(function (t) { add(shortWhen(t) || t.text, curName + ' · ' + t.label, 'front'); });
    if (!isNone && res === 'pass') { add('합격 후', '학교별 일정에 맞춰 등록', 'ok'); add(backWhen, '후기 원서 접수 (지원할 수 없음)', 'stop'); }
    else {
      if (showGen) {
        if (genYes && genSchool) { genSteps.forEach(function (t) { add(shortWhen(t), genSchool.name + (genSchool.dept ? ' ' + genSchool.dept : '') + ' · ' + t.label, 'gen'); }); }
        else add(genWhen, '특성화고 일반전형 (지원하지 않음)', 'skip');
      }
      if (genPass) { add('합격 후', '학교별 일정에 맞춰 등록', 'ok'); add(backWhen, '후기 원서 접수 (지원할 수 없음)', 'stop'); }
      else {
        var bPre = ST.b === 'neq' && ngS ? fullName(ngS) + ' · ' : ST.b === 'fl' && fl ? flLabel + ' · ' : ST.b === 'eq' ? '평준화 일반고 · ' : '';
        BACK[ST.b].steps.forEach(function (t) { add(shortWhen(t) || t.text, bPre + t.label, 'back'); });
        if (ST.b === 'eq' && picks.length) add('내 지망', picksText, 'back');
        if (ST.b === 'fl' && ST.we) {
          var eqA = eqSteps.filter(function (t) { return t.label.indexOf('배정') >= 0; })[0];
          add(eqA ? shortWhen(eqA) : '', '외고 불합격 시 평준화 일반고 배정 (2지망부터)', 'back');
          if (picks.length) add('내 지망', '1지망 ' + fl.name + ' › ' + picksText, 'back');
        }
        add(addWhen, '모두 불합격하면 추가모집 지원', 'opt');
      }
    }
    h += '<section class="card pad path" aria-labelledby="path"><h2 id="path" style="font-size:17px;margin-bottom:8px">나의 지원 경로</h2>' + path.map(function (p) {
      var c = TAG[p[2]];
      return '<div class="p"><span class="w">' + esc(p[0]) + '</span><span class="ln"><i style="background:' + c[1] + '"></i><b></b></span><div class="c"><span>' + esc(p[1]) + '</span>' + chip(c[2], c[1], c[0]) + '</div></div>';
    }).join('') + '</section>';
    h += '<details class="card pad"><summary style="cursor:pointer;font-weight:700;min-height:28px">이중지원이 되는 경우 (합격 취소)</summary><ul class="bul" style="margin-top:12px"><li>한 학교에 합격한 학생이 다른 학교에 지원하는 경우</li><li>불합격이 확정되지 않은 상태에서 다른 학교에 지원하는 경우</li><li>전기 학교에 합격한 학생이 후기 학교에 지원하는 경우</li><li>합격한 학생이 등록 여부와 관계없이 추가모집·수시모집에 지원하는 경우</li><li>제주외고(전국단위 자사고·국제고 포함) 지원자가 비평준화 학교장 전형 고등학교에 동시에 지원하는 경우</li></ul></details>';
    h += '</div></div></div>';
    return h;
  }

  // ---------- 화면: 설명회 안내 ----------
  function viewEvents() {
    var KH = { '교육청': ['#9A4209', '#FDEBDD'], '전기 학교': ['#6B3FA0', '#EFE8F7'], '후기 학교': ['#34418F', '#E7EAF7'] };
    var list = D.sessions.filter(function (x) { return (ST.ek === 'all' || x.host === ST.ek) && (ST.et === 'up' ? x.s >= TODAY : x.s < TODAY); }).sort(byDate);
    if (ST.et === 'past') list.reverse();
    var h = '<div class="page"><div class="title"><h1>설명회 안내</h1><p>학교 입학설명회와 교육청 설명회를 모았어요. 일정은 학교 사정에 따라 바뀔 수 있으니 학교 공지도 함께 확인하세요.</p></div>' +
      '<div class="row" style="justify-content:space-between;align-items:center;gap:12px"><div class="row" style="gap:6px" role="group" aria-label="주최 구분">' +
      [['all', '전체'], ['교육청', '교육청'], ['전기 학교', '전기 학교'], ['후기 학교', '후기 학교']].map(function (k) { return '<button type="button" class="pill dark" data-act="ek" data-v="' + k[0] + '" aria-pressed="' + (ST.ek === k[0]) + '" style="min-height:40px;padding:0 16px;font-size:14px">' + k[1] + '</button>'; }).join('') +
      '</div><div class="seg" role="group" aria-label="기간"><button type="button" data-act="et" data-v="up" aria-pressed="' + (ST.et === 'up') + '">다가오는 설명회</button><button type="button" data-act="et" data-v="past" aria-pressed="' + (ST.et === 'past') + '">지난 설명회</button></div></div>';
    if (!list.length) {
      h += '<p class="card empty">' + (D.sessions.length ? '조건에 맞는 설명회가 없어요.' : '아직 등록된 설명회가 없어요. 일정이 정해지면 여기에 올라와요.') + '</p>';
    } else {
      h += '<ul class="plain sescards">' + list.map(function (x) {
        var c = KH[x.host] || ['#4F5B57', '#EDF0EE'], p = parse(x.s), sc = x.sid ? school(x.sid) : null;
        var ev = { s: x.s, e: '', title: x.title, who: x.who };
        return '<li class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><div class="row" style="gap:14px;flex-wrap:nowrap;align-items:flex-start"><div style="width:58px;flex-shrink:0;text-align:center;border-radius:12px;padding:8px 0;background:' + (x.s >= TODAY ? '#E3F1EF' : '#EDF0EE') + '"><p class="muted" style="font-size:12px">' + p.m + '월</p><p style="font-size:20px;font-weight:700">' + p.d + '</p><p class="muted" style="font-size:12px">(' + WD[dow(x.s)] + ')</p></div>' +
          '<div style="min-width:0;display:flex;flex-direction:column;gap:6px"><div class="row" style="gap:6px">' + chip(x.host || '설명회', c[0], c[1]) + (x.need ? '<span class="chip" style="border:1px solid #DDE3E0">사전 신청</span>' : '') + '</div><p style="font-size:17px;font-weight:700;line-height:1.4">' + esc(x.title) + '</p></div></div>' +
          '<dl class="dl" style="grid-template-columns:52px 1fr"><dt class="muted" style="font-weight:500">시간</dt><dd>' + esc(x.start + (x.end ? ' ~ ' + x.end : '') || '-') + '</dd><dt class="muted" style="font-weight:500">장소</dt><dd>' + esc(x.place || '-') + '</dd><dt class="muted" style="font-weight:500">대상</dt><dd>' + esc(x.who || '-') + '</dd><dt class="muted" style="font-weight:500">신청</dt><dd>' + esc(x.apply || '-') + '</dd></dl>' +
          '<div class="row" style="gap:8px;padding-top:4px;border-top:1px solid #EDF0EE">' + (x.s >= TODAY ? '<a class="btn line" href="' + gcal(ev) + '" target="_blank" rel="noopener">내 캘린더에 추가</a>' : '') +
          (sc ? '<button type="button" class="btn line" data-act="schoolGo" data-v="' + esc(sc.id) + '" style="color:#16201D;border-color:#C9D2CE">학교 정보</button>' : '') + '</div></li>';
      }).join('') + '</ul>';
    }
    h += '</div>';
    return h;
  }

  // ---------- 그리기 ----------
  var RENDER = { calendar: viewCalendar, schools: viewSchools, guide: viewGuide, mock: viewMock, events: viewEvents };
  function navHtml(bottom) {
    return VIEWS.map(function (x) {
      var cur = x.v === ST.view ? ' aria-current="page"' : '';
      return bottom ? '<button type="button" data-act="view" data-v="' + x.v + '"' + cur + '>' + icon(x.icon, 24).replace('stroke-width="2"', 'stroke-width="1.8"') + '<span>' + x.short + '</span></button>'
        : '<button type="button" data-act="view" data-v="' + x.v + '"' + cur + '>' + x.label + '</button>';
    }).join('');
  }
  function render(focusId) {
    if (!D) return;
    var app = document.getElementById('app');
    var pos = null, act = document.activeElement;
    if (focusId && act && act.id === focusId) { try { pos = act.selectionStart; } catch (e) { pos = null; } }
    // 화면 맨 아래 글: 설정 탭의 '기준 자료', '하단 안내', '만든 사람' (하단 안내 줄이 있고 비어 있으면 숨김)
    var maker = String(D.set['만든 사람'] || '').trim();
    var note = ('하단 안내' in D.set) ? String(D.set['하단 안내']).trim() : '일정과 인원은 학교 사정에 따라 바뀔 수 있어요. 지원 전 학교 공지와 담임 선생님 안내를 꼭 확인하세요.';
    var foot = [esc(D.set['기준 자료'] || ''), esc(note), maker ? '<b style="color:var(--ink)">' + esc(maker) + '</b>' : ''].filter(Boolean).join('<br>');
    app.innerHTML = RENDER[ST.view]() + '<p class="foot">' + foot + '</p>';
    document.getElementById('topnav').innerHTML = navHtml(false);
    document.getElementById('bottomnav').innerHTML = navHtml(true);
    if (focusId) {
      var el = document.getElementById(focusId);
      if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} }
    }
  }

  var ACT = {
    view: function (v) { ST.view = v; render(); window.scrollTo(0, 0); },
    calView: function (v) { ST.calView = v; render(); },
    mstep: function (v) { ST.mi = Math.max(0, Math.min(MONTHS.length - 1, ST.mi + (+v))); render(); },
    mi: function (v) { ST.mi = +v; render(); },
    sel: function (v) { ST.sel = v; render(); },
    off: function (v) { ST.off[v] = !ST.off[v]; render(); },
    phase: function (v) { ST.phase = v; render(); },
    school: function (v) { ST.school = v; render(); if (window.innerWidth < 720) { var a = document.querySelector('article'); if (a) a.scrollIntoView(); } },
    schoolGo: function (v) { ST.school = v; ST.view = 'schools'; render(); window.scrollTo(0, 0); },
    mockFrom: function (v) {
      var s = school(v); ST.view = 'mock';
      if (s && s.group.indexOf('후기') === 0) {
        ST.f = 'none'; ST.b = s.group === '후기 평준화' ? 'eq' : s.group === '후기 비평준화' ? 'neq' : 'fl';
        if (ST.b === 'eq') { for (var i = 0; i < SLOTS; i++) ST['w' + i] = ''; ST.w0 = s.id; }
        if (ST.b === 'neq') ST.ng = s.id;
      }
      else if (s && s.group === '전기 특목') ST.f = 's:' + s.id; else { ST.f = s && s.spCap ? 'vosp' : 'vogen'; ST.vs = v; }
      render(); window.scrollTo(0, 0);
    },
    f: function (v) { ST.f = v; ST.vs = ''; render(); },
    r: function (v) { ST.r = v; render(); },
    gen: function (v) { ST.gen = v; render(); },
    gr: function (v) { ST.gr = v; render(); },
    b: function (v) { ST.b = v; render(); },
    we: function () { ST.we = !ST.we; render(); },
    sex: function (v) { ST.sex = ST.sex === v ? '' : v; render(); },
    wclear: function () { for (var i = 0; i < SLOTS; i++) ST['w' + i] = ''; render(); },
    ek: function (v) { ST.ek = v; render(); },
    et: function (v) { ST.et = v; render(); }
  };
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || !ACT[t.getAttribute('data-act')]) return;
    if (t.tagName === 'INPUT') { ACT[t.getAttribute('data-act')](); return; }
    ACT[t.getAttribute('data-act')](t.getAttribute('data-v'), t);
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-input');
    if (!k) return;
    ST[k] = e.target.value;
    if (k === 'q') render('q');
    else {
      var cur = school(ST.school), out = document.getElementById('calcres');
      if (cur && cur.limit && out) { var r = attCalc(cur); out.textContent = r.text; out.style.background = r.ok ? '#E3F1EF' : '#FDE8E6'; out.style.color = r.ok ? '#0D6B63' : '#B42318'; }
    }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-change');
    if (!k) return;
    ST[k] = e.target.value;
    render(k);
  });

  function fail(err) {
    document.getElementById('app').innerHTML = '<p class="loading">정보를 불러오지 못했어요. 잠시 후 새로고침해 주세요.<br><span class="small">' + esc(err && err.message ? err.message : err) + '</span></p>';
  }
  window.__goipInit = init;
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(function (json) { try { init(JSON.parse(json)); } catch (e) { fail(e); } }).withFailureHandler(fail).getData();
  } else if (/^https:\/\//.test(window.GOIP_API || '')) {
    // 바깥 주소에서 열 때: 로그인 없이 시트 내용을 JSON으로 받아 와요.
    var api = window.GOIP_API.trim();
    fetch(api + (api.indexOf('?') >= 0 ? '&' : '?') + 'format=json')
      .then(function (r) { if (!r.ok) throw new Error('서버 응답 ' + r.status); return r.text(); })
      .then(function (t) { var d; try { d = JSON.parse(t); } catch (e) { throw new Error('웹앱 주소나 배포 설정을 확인해 주세요.'); } init(d); })
      .catch(fail);
  } else if (!window.__goipNoAutoLoad) {
    fetch('data.json').then(function (r) { return r.json(); }).then(init).catch(fail);
  }
})();
</script>
</body>
</html>
